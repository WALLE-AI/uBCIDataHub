<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1420" viewBox="0 0 1680 1420" role="img" aria-labelledby="title desc"><title id="title">神经信号基础模型五层技术架构</title><desc id="desc">由下至上为算力调度、数据供给、预训练与微调、评估基准、模型服务。层间传递资源环境、版本化数据、候选模型和发布制品；权限、质量、版本、审计贯穿全周期。为目标技术架构，接口为建议契约。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f33"/><stop offset="1" stop-color="#0a1322"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6ce5da" stroke-width="1.3"/></marker></defs><style>text{font-family:Inter,'Microsoft YaHei','PingFang SC',sans-serif}</style><rect width="1680" height="1420" rx="24" fill="url(#bg)"/><text x="56" y="58" font-size="13" fill="#6ce5da" font-weight="600">BCI DATAHUB  /  TECHNICAL ARCHITECTURE</text><text x="56" y="110" font-size="36" fill="#f2f7ff" font-weight="700">神经信号基础模型 · 五层技术架构</text><text x="56" y="146" font-size="17" fill="#a6b9d0" font-weight="400">从算力底座到模型服务，以可追溯的数据与模型制品贯穿全周期。</text><rect x="1405" y="66" width="218" height="36" rx="18" fill="#22324a" stroke="#42566e"/><text x="1430" y="90" font-size="14" fill="#c7d6e9" font-weight="400">目标架构 · 接口契约建议</text><rect x="56" y="180" width="1568" height="66" rx="12" fill="#242340" stroke="#615980"/><text x="80" y="207" font-size="12" fill="#b6a1ff" font-weight="600">服务输出</text><text x="80" y="231" font-size="18" fill="#e2def8" font-weight="600">推理服务 · 授权模型包 · 边缘部署制品 · 可复现研究与验证报告</text><text x="102" y="279" font-size="12" fill="#91a7c1" font-weight="600">能力层级</text><text x="316" y="279" font-size="12" fill="#91a7c1" font-weight="600">核心模块 / 职责边界</text><text x="1176" y="279" font-size="12" fill="#91a7c1" font-weight="600">层间接口 / 追溯字段</text><text x="1467" y="279" font-size="12" fill="#91a7c1" font-weight="600">贯穿能力</text><path d="M73 1102V304" fill="none" stroke="#6ce5da" stroke-width="2" marker-end="url(#arrow)"/><rect x="96" y="298" width="1344" height="136" rx="12" fill="#122237" stroke=